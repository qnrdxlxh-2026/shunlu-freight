<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>顺路货运 - 运营后台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; }
    .header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); color: white; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; height: 60px; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-logo { font-size: 24px; }
    .header-title { font-size: 18px; font-weight: 600; }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .user-info { font-size: 13px; opacity: 0.85; }
    .btn-logout { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .btn-logout:hover { background: rgba(255,255,255,0.25); }
    .container { max-width: 1400px; margin: 0 auto; padding: 20px 24px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .stat-card { background: white; border-radius: 12px; padding: 18px 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border: 1px solid #f0f0f0; }
    .stat-card .stat-icon { font-size: 22px; margin-bottom: 8px; }
    .stat-card .stat-value { font-size: 28px; font-weight: 700; color: #1a1a2e; }
    .stat-card .stat-label { font-size: 12px; color: #888; margin-top: 4px; }
    .stat-card.blue .stat-value { color: #0f3460; }
    .stat-card.green .stat-value { color: #27ae60; }
    .stat-card.orange .stat-value { color: #e67e22; }
    .stat-card.red .stat-value { color: #e74c3c; }
    .stat-card.purple .stat-value { color: #8e44ad; }
    .tabs-bar { background: white; border-radius: 12px; padding: 6px; display: flex; gap: 2px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); flex-wrap: wrap; }
    .tab-btn { flex: 1; min-width: 90px; padding: 10px 14px; border: none; background: transparent; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; color: #666; transition: all 0.2s; white-space: nowrap; }
    .tab-btn:hover { background: #f5f5f5; color: #1a1a2e; }
    .tab-btn.active { background: #1a1a2e; color: white; font-weight: 600; }
    .card { background: white; border-radius: 12px; padding: 20px 24px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border: 1px solid #f0f0f0; }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #f5f5f5; }
    .card-title { font-size: 15px; font-weight: 600; color: #1a1a2e; display: flex; align-items: center; gap: 8px; }
    .card-title .icon { font-size: 18px; }
    .card-actions { display: flex; gap: 8px; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #f8f9fa; padding: 10px 12px; text-align: left; font-size: 11px; font-weight: 600; color: #666; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #eee; }
    td { padding: 10px 12px; font-size: 13px; color: #333; border-bottom: 1px solid #f5f5f5; vertical-align: middle; }
    tr:hover td { background: #fafafa; }
    tr:last-child td { border-bottom: none; }
    .btn { padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; transition: all 0.2s; }
    .btn-sm { padding: 4px 10px; font-size: 11px; }
    .btn-primary { background: #1a1a2e; color: white; }
    .btn-primary:hover { background: #2d2d4a; }
    .btn-success { background: #27ae60; color: white; }
    .btn-success:hover { background: #219a52; }
    .btn-danger { background: #e74c3c; color: white; }
    .btn-danger:hover { background: #c0392b; }
    .btn-warning { background: #f39c12; color: white; }
    .btn-warning:hover { background: #d68910; }
    .btn-info { background: #3498db; color: white; }
    .btn-info:hover { background: #2980b9; }
    .btn-outline { background: white; color: #666; border: 1px solid #ddd; }
    .btn-outline:hover { border-color: #1a1a2e; color: #1a1a2e; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
    .badge-green { background: #d4edda; color: #155724; }
    .badge-red { background: #f8d7da; color: #721c24; }
    .badge-yellow { background: #fff3cd; color: #856404; }
    .badge-blue { background: #d1ecf1; color: #0c5460; }
    .badge-gray { background: #e9ecef; color: #495057; }
    .badge-purple { background: #e8daef; color: #6c3483; }
    .badge-pending { background: #fff3cd; color: #856404; }
    .badge-approved { background: #d4edda; color: #155724; }
    .badge-rejected { background: #f8d7da; color: #721c24; }
    .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    .role-1 { background: #e3f2fd; color: #1565c0; }
    .role-2 { background: #fff3e0; color: #e65100; }
    .role-3 { background: #e8f5e9; color: #2e7d32; }
    .role-4 { background: #fce4ec; color: #ad1457; }
    .role-5 { background: #ede7f6; color: #512da8; }
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; }
    .modal-overlay.show { display: flex; justify-content: center; align-items: center; }
    .modal { background: white; border-radius: 14px; width: 480px; max-width: 95vw; max-height: 85vh; overflow: hidden; display: flex; flex-direction: column; }
    .modal-header { padding: 18px 24px; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; }
    .modal-title { font-size: 16px; font-weight: 600; color: #1a1a2e; }
    .modal-close { background: none; border: none; font-size: 22px; cursor: pointer; color: #999; padding: 0; line-height: 1; }
    .modal-close:hover { color: #333; }
    .modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; }
    .modal-footer { padding: 14px 24px; border-top: 1px solid #eee; display: flex; gap: 10px; justify-content: flex-end; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; font-weight: 500; color: #333; margin-bottom: 6px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 9px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; transition: border-color 0.2s; background: white; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #1a1a2e; }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .form-hint { font-size: 11px; color: #999; margin-top: 4px; }
    .filter-row { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
    .filter-row input { flex: 1; min-width: 180px; padding: 8px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; }
    .filter-row select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; background: white; min-width: 110px; }
    .empty-state { text-align: center; padding: 40px 20px; color: #999; }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .loading { text-align: center; padding: 40px; color: #999; font-size: 14px; }
    pre { background: #f5f5f5; padding: 12px; border-radius: 8px; font-size: 12px; overflow-x: auto; line-height: 1.6; max-height: 300px; overflow-y: auto; }
    .td-secondary { font-size: 11px; color: #999; }
    .action-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .config-item { background: #f8f9fa; border-radius: 10px; padding: 18px; }
    .config-item h4 { font-size: 13px; margin-bottom: 10px; color: #333; }
    .toast-fixed { position: fixed; top: 80px; right: 20px; z-index: 9999; max-width: 300px; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 768px) {
      .header { padding: 0 16px; }
      .container { padding: 12px; }
      .tabs-bar { gap: 2px; }
      .tab-btn { min-width: 75px; font-size: 12px; padding: 8px 10px; }
      .form-row { grid-template-columns: 1fr; }
      .config-grid { grid-template-columns: 1fr; }
    }
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); }
    .login-box { background: white; border-radius: 16px; padding: 40px; width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .login-logo { text-align: center; font-size: 40px; margin-bottom: 8px; }
    .login-title { text-align: center; font-size: 22px; font-weight: 700; color: #1a1a2e; margin-bottom: 4px; }
    .login-sub { text-align: center; color: #888; font-size: 13px; margin-bottom: 28px; }
    .login-box .form-group input { padding: 12px 14px; font-size: 14px; }
    .login-box .btn { width: 100%; padding: 12px; font-size: 15px; margin-top: 8px; }
    .login-tips { text-align: center; margin-top: 16px; font-size: 12px; color: #999; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
    .site-footer { text-align: center; padding: 16px; color: #999; font-size: 12px; border-top: 1px solid #e5e5e5; margin-top: 32px; }
    .site-footer a { color: #999; text-decoration: none; }
  </style>
</head>
<body>
  <!-- 登录页 -->
  <div id="loginPage" class="login-wrap">
    <div class="login-box">
      <div class="login-logo">🚚</div>
      <div class="login-title">顺路货运</div>
      <div class="login-sub">运营管理后台</div>
      <div class="form-group">
        <label>手机号</label>
        <input id="loginPhone" placeholder="输入手机号" value="admin">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input id="loginPwd" type="password" placeholder="输入密码" value="admin123">
      </div>
      <button class="btn btn-primary" onclick="login()">登 录</button>
      <div class="login-tips">测试账号：admin / admin123</div>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="mainPage" style="display:none">
    <div class="header">
      <div class="header-left">
        <span class="header-logo">🚚</span>
        <span class="header-title">顺路货运 · 运营后台</span>
      </div>
      <div class="header-right">
        <span class="user-info" id="userDisplay">管理员</span>
        <button class="btn-logout" onclick="logout()">退出</button>
      </div>
    </div>
    
    <div class="container">
      <!-- 快捷统计 -->
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card blue"><div class="stat-icon">👥</div><div class="stat-value" id="statUsers">-</div><div class="stat-label">总用户</div></div>
        <div class="stat-card green"><div class="stat-icon">🏪</div><div class="stat-value" id="statMerchants">-</div><div class="stat-label">商家</div></div>
        <div class="stat-card orange"><div class="stat-icon">🚛</div><div class="stat-value" id="statDrivers">-</div><div class="stat-label">司机</div></div>
        <div class="stat-card purple"><div class="stat-icon">📦</div><div class="stat-value" id="statOrders">-</div><div class="stat-label">总订单</div></div>
        <div class="stat-card green"><div class="stat-icon">💰</div><div class="stat-value" id="statAmount">-</div><div class="stat-label">总交易额</div></div>
        <div class="stat-card red"><div class="stat-icon">⛔</div><div class="stat-value" id="statBlacklist">-</div><div class="stat-label">黑名单</div></div>
        <div class="stat-card orange"><div class="stat-icon">📋</div><div class="stat-value" id="statComplaints">-</div><div class="stat-label">待处理投诉</div></div>
        <div class="stat-card blue"><div class="stat-icon">📞</div><div class="stat-value" id="statCalls">-</div><div class="stat-label">通话记录</div></div>
      </div>
      
      <!-- 标签栏 -->
      <div class="tabs-bar">
        <button class="tab-btn active" onclick="switchTab('overview', event)">📊 数据概览</button>
        <button class="tab-btn" onclick="switchTab('merchant', event)">🏪 商家管理</button>
        <button class="tab-btn" onclick="switchTab('driver', event)">🚚 货车管理</button>
        <button class="tab-btn" onclick="switchTab('privatecar', event)">🚗 私家车管理</button>
        <button class="tab-btn" onclick="switchTab('personal', event)">👤 个人管理</button>
        <button class="tab-btn" onclick="switchTab('orders', event)">📦 订单管理</button>
        <button class="tab-btn" onclick="switchTab('finance', event)">💰 财务管理</button>
        <button class="tab-btn" onclick="switchTab('blacklist', event)">⛔ 黑名单</button>
        <button class="tab-btn" onclick="switchTab('complaints', event)">📋 投诉管理</button>
        <button class="tab-btn" onclick="switchTab('messages', event)">💬 通讯记录</button>
        <button class="tab-btn" onclick="window.open('commission.html','_blank')">💰 佣金管控</button>
        <button class="tab-btn" onclick="switchTab('driverMode', event)">🚛 司机模式</button>
        <button class="tab-btn" onclick="switchTab('test', event)">🧪 接口测试</button>
      </div>
      
      <!-- 内容区 -->
      <div id="tabContent"></div>
    </div>
  </div>

  <!-- 通用弹窗 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">弹窗</span>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

<script>
// ===== 全局状态 =====
let token = '';
let currentTab = '';

// ===== API =====
async function api(path, method = 'GET', data = null) {
  try {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (token) opts.headers['Authorization'] = 'Bearer ' + token;
    if (data) opts.body = JSON.stringify(data);
    const res = await fetch('/api' + path, opts);
    return await res.json();
  } catch (e) {
    return { code: -1, msg: '网络错误: ' + e.message };
  }
}

// ===== 登录登出 =====
async function login() {
  const phone = document.getElementById('loginPhone').value.trim();
  const pwd = document.getElementById('loginPwd').value;
  if (!phone || !pwd) return alert('请输入手机号和密码');
  let res = await api('/user/login', 'POST', { phone, password: pwd });
  if (res.code !== 0) res = await api('/user/register', 'POST', { phone, password: pwd, role: 4 });
  if (res.code === 0) {
    token = res.data.token;
    localStorage.setItem('admin_token', token);
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('mainPage').style.display = 'block';
    document.getElementById('userDisplay').textContent = phone + ' (管理员)';
    await loadStats();
    switchTab('overview');
  } else { alert('登录失败: ' + res.msg); }
}

function logout() {
  token = '';
  localStorage.removeItem('admin_token');
  document.getElementById('mainPage').style.display = 'none';
  document.getElementById('loginPage').style.display = 'flex';
}

(function init() {
  const saved = localStorage.getItem('admin_token');
  if (saved) {
    token = saved;
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('mainPage').style.display = 'block';
    loadStats();
    switchTab('overview');
  }
})();

// ===== 统计概览 =====
async function loadStats() {
  const [stats, blacklist, complaints, calls] = await Promise.all([
    api('/admin/stats').catch(() => ({})),
    api('/admin/blacklist').catch(() => ({})),
    api('/admin/complaints').catch(() => ({})),
    api('/admin/calls').catch(() => ({}))
  ]);
  const s = stats.data || {};
  document.getElementById('statUsers').textContent = s.totalUsers || 0;
  document.getElementById('statMerchants').textContent = s.merchants || 0;
  document.getElementById('statDrivers').textContent = s.drivers || 0;
  document.getElementById('statOrders').textContent = s.totalOrders || 0;
  document.getElementById('statAmount').textContent = '¥' + (s.totalAmount || 0);
  const bl = blacklist.data || [];
  document.getElementById('statBlacklist').textContent = bl.filter(b => b.type === 'blacklist').length;
  const cp = complaints.data || [];
  document.getElementById('statComplaints').textContent = cp.filter(c => c.status === 'pending').length;
  const cl = calls.data || [];
  document.getElementById('statCalls').textContent = cl.length;
}

// ===== 切换 Tab =====
async function switchTab(tab, evt) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  if (evt && evt.target) evt.target.classList.add('active');
  const content = document.getElementById('tabContent');
  content.innerHTML = '<div class="loading">加载中...</div>';
  try {
    if (tab === 'overview') await renderOverview(content);
    else if (tab === 'merchant') await renderMerchant(content);
    else if (tab === 'driver') await renderDriver(content);
    else if (tab === 'privatecar') await renderPrivateCar(content);
    else if (tab === 'personal') await renderPersonal(content);
    else if (tab === 'users') await renderUsers(content);
    else if (tab === 'orders') await renderOrders(content);
    else if (tab === 'finance') await renderFinance(content);
    else if (tab === 'blacklist') await renderBlacklist(content);
    else if (tab === 'complaints') await renderComplaints(content);
    else if (tab === 'messages') await renderMessages(content);
    else if (tab === 'config') await renderConfig(content);
    else if (tab === 'driverMode') await renderDriverMode(content);
    else if (tab === 'test') await renderTest(content);
    else content.innerHTML = '<div class="loading">未知页面</div>';
  } catch (e) { content.innerHTML = '<div class="loading" style="color:#e74c3c">加载失败: ' + e.message + '</div>'; }
}

// ===== 弹窗 =====
function openModal(title, bodyHTML, footerHTML) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHTML;
  document.getElementById('modalFooter').innerHTML = footerHTML;
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('show'); }

// ===== Toast =====
function showToast(type, msg) {
  const el = document.createElement('div');
  el.className = 'card';
  el.style.cssText = 'position:fixed;top:80px;right:20px;z-index:9999;max-width:300px;animation:fadeIn 0.3s;background:' + (type === 'success' ? '#d4edda;border:1px solid #c3e6cb' : '#f8d7da;border:1px solid #f5c6cb') + ';color:' + (type === 'success' ? '#155724' : '#721c24') + ';padding:12px 16px;border-radius:8px;font-size:13px';
  el.innerHTML = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ===== Tab: 数据概览 =====
async function renderOverview(el) {
  const [stats, orders] = await Promise.all([api('/admin/stats'), api('/admin/order-list')]);
  const s = stats.data || {};
  const ordersList = (orders.data || []).slice(0, 10);
  const statusMap = ['','待支付','待取货','运输中','已送达','已完成'];
  const statusCls = ['','badge-yellow','badge-blue','badge-green','badge-gray','badge-gray'];
  el.innerHTML = `
    <div class="card">
      <div class="card-header"><div class="card-title"><span class="icon">📊</span>平台运营概览</div></div>
      <table>
        <thead><tr><th>指标</th><th>数值</th><th>说明</th></tr></thead>
        <tbody>
          <tr><td>总用户数</td><td><b>${s.totalUsers||0}</b></td><td>所有注册用户</td></tr>
          <tr><td>商家</td><td><b>${s.merchants||0}</b></td><td>货主/托运方</td></tr>
          <tr><td>货车司机</td><td><b>${s.drivers||0}</b></td><td>货车承运方</td></tr>
          <tr><td>私家车主</td><td><b>${s.privateCars||0}</b></td><td>小件承运（≤20kg）</td></tr>
          <tr><td>总订单数</td><td><b>${s.totalOrders||0}</b></td><td>全部交易订单</td></tr>
          <tr><td>总交易额</td><td><b style="color:#27ae60">¥${s.totalAmount||0}</b></td><td>平台总流水</td></tr>
          <tr><td>今日订单</td><td><b>${s.todayOrders||0}</b></td><td>今日新增</td></tr>
          <tr><td>今日交易额</td><td><b>¥${s.todayAmount||0}</b></td><td>今日流水</td></tr>
        </tbody>
      </table>
    </div>
    <div class="card">
      <div class="card-header">
        <div class="card-title"><span class="icon">🕐</span>最近订单</div>
        <button class="btn btn-outline btn-sm" onclick="switchTab('orders')">查看全部 →</button>
      </div>
      <table>
        <thead><tr><th>#</th><th>商家</th><th>司机</th><th>路线</th><th>金额</th><th>状态</th><th>时间</th></tr></thead>
        <tbody>
          ${ordersList.length ? ordersList.map(o => `<tr>
            <td><b>#${o.id}</b></td><td>商家${o.merchant_id||'-'}</td><td>司机${o.driver_id||'-'}</td>
            <td class="td-secondary">${o.start_addr||''} → ${o.end_addr||''}</td>
            <td><b>¥${o.price||0}</b></td>

function renderUsersRows(users) {
  const tbody = document.getElementById('usersTbody');
  if (!users.length) { tbody.innerHTML = '<tr><td colspan="8" class="empty-state"><div class="icon">👤</div><p>暂无用户</p></td></tr>'; return; }
  const statusMap = { '-1':'黑名单','0':'禁用','1':'正常','2':'白名单' };
  const statusCls = { '-1':'badge-red','0':'badge-gray','1':'badge-green','2':'badge-blue' };
  const roleMap = {1:'商家',2:'货车司机',3:'私家车主',4:'管理员',5:'个人用户'};
  tbody.innerHTML = users.map(u => `<tr>
    <td><b>#${u.id}</b></td><td>${u.phone||'-'}</td>
    <td><span class="role-badge role-${u.role}">${roleMap[u.role]||'未知'}</span></td>
    <td>${u.real_name||'-'}</td><td>¥${u.balance||0}</td>
    <td><span class="badge ${statusCls[u.status]||'badge-gray'}">${statusMap[u.status]||'未知'}</span></td>
    <td class="td-secondary">${(u.create_time||'').slice(0,10)}</td>
    <td><div class="action-group">
      ${u.status!=-1?`<button class="btn btn-danger btn-sm" onclick="setUserStatus(${u.id},-1)">拉黑</button>`:''}
      ${u.status!=2?`<button class="btn btn-info btn-sm" onclick="setUserStatus(${u.id},2)">白名单</button>`:''}
      ${u.status!=1?`<button class="btn btn-success btn-sm" onclick="setUserStatus(${u.id},1)">恢复</button>`:''}
      <button class="btn btn-outline btn-sm" onclick="viewUserDetail(${u.id})">详情</button>
    </div></td>
  </tr>`).join('');
}

function filterUsers() {
  const q = document.getElementById('userSearch').value.toLowerCase();
  const role = document.getElementById('userRoleFilter').value;
  const status = document.getElementById('userStatusFilter').value;
  const list = window._allUsers.filter(u => {
    const matchQ = !q || (u.phone&&u.phone.includes(q)) || (u.real_name&&u.real_name.toLowerCase().includes(q)) || String(u.id).includes(q);
    return matchQ && (!role||String(u.role)===role) && (!status||String(u.status)===status);
  });
  renderUsersRows(list);
}

async function setUserStatus(userId, status) {
  const reason = status===-1 ? (prompt('请输入拉黑原因（可选）：')||'管理员操作') : status===2 ? (prompt('请输入白名单原因（可选）：')||'管理员操作') : '恢复正常';
  const res = await api('/admin/users/' + userId + '/status', 'PUT', { status, reason });
  if (res.code===0) { showToast('success','用户状态已更新'); await switchTab('users'); } else { showToast('error',res.msg||'操作失败'); }
}

async function toggleDriverMode(driverId, currentMode) {
  const newMode = currentMode === 0 ? 1 : 0;

async function tReg(role) {
  const phone = '1'+Math.floor(Math.random()*900000000+100000000);
  const r = await api('/user/register','POST',{phone,password:'test123',role});
  if (r.code===0) { _tTokens[role]=r.data.token; document.getElementById('tr1').textContent = JSON.stringify(r.data,null,2); }

async function tPub() {
  if (!_tTokens[1]) return alert('请先注册商家');
  const r = await fetch('/api/merchant/publish-goods',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+_tTokens[1]},body:JSON.stringify({start_addr:'甘孜州康定市',end_addr:'成都市武侯区',weight:15,price:200,goods_value:800,remark:'测试货源'})});
  document.getElementById('tr4').textContent = JSON.stringify(await r.json(),null,2);
}
async function tTake() {
  if (!_tTokens[2]) return alert('请先注册司机');
  const m = await fetch('/api/driver/match-goods',{headers:{'Authorization':'Bearer '+_tTokens[2]}});
  const match = await m.json();

  document.getElementById('tr5').textContent = JSON.stringify(await r.json(),null,2);
}
async function tFull() {
  const log = (id,msg) => { document.getElementById(id).textContent=msg; };

  const g = await fetch('/api/merchant/publish-goods',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+_tTokens[1]},body:JSON.stringify({start_addr:'甘孜州康定市',end_addr:'成都市武侯区',weight:20,price:300,goods_value:1000,remark:'完整测试'})});
  const gj = await g.json();
  document.getElementById('tr6').textContent+='\n✅ 货源 #'+(gj.data?.goods_id||gj.msg);
  const o = await fetch('/api/driver/take-order',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+_tTokens[2]},body:JSON.stringify({goods_id:gj.data?.goods_id})});

  window._personals = users;
  const statusMap = { '-1':'黑名单','0':'禁用','1':'待审核','2':'已认证','3':'白名单' };
  const statusCls = { '-1':'badge-red','0':'badge-gray','1':'badge-yellow','2':'badge-green','3':'badge-blue' };
  el.innerHTML = `
    <div class="card">
      <div class="card-header">
        <div class="card-title"><span class="icon">👤</span>个人用户管理 <small style="font-weight:400;color:#888">共 ${users.length} 人</small></div>
      </div>
      <div class="filter-row">
        <input id="personalSearch" placeholder="搜索手机号/姓名..." oninput="filterPersonals()">
        <select id="personalStatusFilter" onchange="filterPersonals()"><option value="">全部状态</option><option value="1">待审核</option><option value="2">已认证</option><option value="-1">黑名单</option></select>
      </div>
      <table><thead><tr><th>ID</th><th>手机号</th><th>姓名</th><th>余额</th><th>状态</th><th>注册时间</th><th>操作</th></tr></thead><tbody id="personalsTbody"></tbody></table>
    </div>`;
  renderPersonalsRows(users);
}

function renderPersonalsRows(users) {
  const tbody = document.getElementById('personalsTbody');
  if (!users.length) { tbody.innerHTML = '<tr><td colspan="7" class="empty-state"><div class="icon">👤</div><p>暂无个人用户</p></td></tr>'; return; }
  const statusMap = { '-1':'黑名单','0':'禁用','1':'待审核','2':'已认证','3':'白名单' };
  const statusCls = { '-1':'badge-red','0':'badge-gray','1':'badge-yellow','2':'badge-green','3':'badge-blue' };
  tbody.innerHTML = users.map(u => `<tr>
    <td><b>#${u.id}</b></td><td>${u.phone||'-'}</td>
    <td>${u.real_name||'-'}</td><td>¥${u.balance||0}</td>
    <td><span class="badge ${statusCls[u.status]||'badge-gray'}">${statusMap[u.status]||'未知'}</span></td>
    <td class="td-secondary">${(u.create_time||'').slice(0,10)}</td>
    <td><div class="action-group">
      ${u.status===1?`<button class="btn btn-success btn-sm" onclick="auditUser(${u.id},2,'personal')">✓ 认证</button><button class="btn btn-danger btn-sm" onclick="auditUser(${u.id},-1,'personal')">✗ 拒绝</button>`:''}
      ${u.status===2?`<button class="btn btn-warning btn-sm" onclick="auditUser(${u.id},-1,'personal')">拉黑</button>`:''}
      <button class="btn btn-outline btn-sm" onclick="viewPersonalDetail(${u.id})">详情</button>
    </div></td>
  </tr>`).join('');
}

function filterPersonals() {
  const q = document.getElementById('personalSearch').value.toLowerCase();
  const status = document.getElementById('personalStatusFilter').value;
  const list = window._personals.filter(u => {
    const matchQ = !q || (u.phone&&u.phone.includes(q)) || (u.real_name&&u.real_name.toLowerCase().includes(q));
    return matchQ && (!status||String(u.status)===status);
  });
  renderPersonalsRows(list);
}

function viewPersonalDetail(id) {
  const u = window._personals.find(x => x.id===id);
  if (!u) return;
  const body = `
    <div class="form-row"><div class="form-group"><label>用户ID</label><input value="#${u.id}" readonly></div><div class="form-group"><label>手机号</label><input value="${u.phone||'-'}" readonly></div></div>
    <div class="form-row"><div class="form-group"><label>姓名</label><input value="${u.real_name||'-'}" readonly></div><div class="form-group"><label>余额</label><input value="¥${u.balance||0}" readonly></div></div>
    <div class="form-row"><div class="form-group"><label>状态</label><input value="${{'-1':'黑名单','0':'禁用','1':'待审核','2':'已认证'}[u.status]||'未知'}" readonly></div><div class="form-group"><label>注册时间</label><input value="${u.create_time||'-'}" readonly></div></div>`;
  const footer = `<button class="btn btn-outline" onclick="closeModal()">关闭</button>`;
  openModal('👤 个人用户详情', body, footer);
}

// ===== 通用审核函数 =====
async function auditUser(userId, status, tabName) {
  const action = status === 2 ? '认证通过' : status === -1 ? '拉黑' : '修改状态';
  if (!confirm(`确定${action}该用户？`)) return;
  const reason = status === -1 ? (prompt('请输入拉黑原因（可选）：') || '管理员操作') : '';
  const res = await api('/admin/users/' + userId + '/status', 'PUT', { status, reason });
  if (res.code === 0) {
    showToast('success', '用户状态已更新');
    switchTab(tabName);
  } else {
    showToast('error', res.msg || '操作失败');
  }
}

// ===== Tab: 订单管理 =====
async function renderOrders(el) {
  const res = await api('/admin/order-list');
  const list = res.data||[];
  window._orders = list;
  const statusMap=['','待支付','待取货','运输中','已送达','已完成'];
  const statusCls=['','badge-yellow','badge-blue','badge-green','badge-gray','badge-gray'];
  el.innerHTML = `
    <div class="card">
      <div class="card-header">
        <div class="card-title"><span class="icon">📦</span>订单列表 <small style="font-weight:400;color:#888">共 ${list.length} 条</small></div>
        <div class="filter-row" style="margin:0">
          <select id="orderStatusFilter" onchange="filterOrders()"><option value="">全部状态</option><option value="1">待支付</option><option value="2">待取货</option><option value="3">运输中</option><option value="4">已送达</option><option value="5">已完成</option></select>
        </div>
      </div>
      <table><thead><tr><th>#</th><th>商家</th><th>司机</th><th>路线</th><th>金额</th><th>佣金</th><th>司机收入</th><th>状态</th><th>时间</th><th>操作</th></tr></thead><tbody id="ordersTbody"></tbody></table>
    </div>`;
  renderOrdersRows(list);
}

function renderOrdersRows(list) {
  const tbody = document.getElementById('ordersTbody');
  if (!list.length) { tbody.innerHTML='<tr><td colspan="9" class="empty-state"><div class="icon">📭</div><p>暂无订单</p></td></tr>'; return; }
  const statusMap=['','待支付','待取货','运输中','已送达','已完成'];
  const statusCls=['','badge-yellow','badge-blue','badge-green','badge-gray','badge-gray'];
  tbody.innerHTML = list.map(o => `<tr>
    <td><b>#${o.id}</b></td><td>商家${o.merchant_id||'-'}</td><td>司机${o.driver_id||'-'}</td>
    <td class="td-secondary">${o.start_addr||''} → ${o.end_addr||''}</td>
    <td><b>¥${o.price||0}</b></td><td class="td-secondary">¥${o.commission_fee||0} (${o.commission_rate||0}%)</td><td class="td-secondary">¥${o.driver_amount||0}</td>
    <td><span class="badge ${statusCls[o.status]||'badge-gray'}">${statusMap[o.status]||'未知'}</span></td>
    <td class="td-secondary">${(o.create_time||'').slice(0,16)}</td>
    <td><button class="btn btn-sm btn-primary" onclick="showOrderDetail(${o.id})">详情</button></td>
  </tr>`).join('');
}

// 显示订单详情（含实时位置）
async function showOrderDetail(orderId) {
  const order = window._orders.find(o => o.id === orderId);
  if (!order) return;
  
  // 获取司机实时位置
  let locationHtml = '';
  if (order.driver_id && order.status >= 2 && order.status <= 4) {
    try {
      const locRes = await api(`/driver/location/${order.driver_id}`);
      if (locRes.code === 0 && locRes.data) {
        locationHtml = `<div class="location-info">
          <p><b>📍 司机当前位置</b></p>
          <p>纬度: ${locRes.data.lat}, 经度: ${locRes.data.lng}</p>
          <p>更新时间: ${locRes.data.update_time || '-'}</p>
          <a href="https://uri.amap.com/marker?position=${locRes.data.lng},${locRes.data.lat}" target="_blank" class="btn btn-sm btn-primary">在高德地图查看</a>
        </div>`;
      }
    } catch(e) {}
  }
  
  const statusMap=['','待支付','待取货','运输中','已送达','已完成'];
  showModal(
    `<b>订单 #${orderId} 详情</b>`,
    `<div class="order-detail">
      <p><b>商家ID:</b> ${order.merchant_id||'-'}</p>
      <p><b>司机ID:</b> ${order.driver_id||'-'}</p>
      <p><b>起点:</b> ${order.start_addr||'-'}</p>
      <p><b>终点:</b> ${order.end_addr||'-'}</p>
      <p><b>运费:</b> ¥${order.price||0}</p>
      <p><b>佣金:</b> ¥${order.commission_fee||0} (${order.commission_rate||0}%)</p>
      <p><b>司机收入:</b> ¥${order.driver_amount||0}</p>
      <p><b>状态:</b> ${statusMap[order.status]||'未知'}</p>
      <p><b>创建时间:</b> ${order.create_time||'-'}</p>
      <p><b>取件码:</b> ${order.pickup_code||'-'}</p>
      ${locationHtml}
    </div>`,
    ''
  );
}

function filterOrders() {
  const status = document.getElementById('orderStatusFilter').value;
  renderOrdersRows(window._orders.filter(o => !status||String(o.status)===status));
}

// ===== Tab: 财务管理 =====
async function renderFinance(el) {
  const res = await api('/admin/settlements?status=all');
  const list = res.data || [];
  window._settlements = list;
  
  // 统计数据
  const pending = list.filter(s => s.status === 'pending');
  const approved = list.filter(s => s.status === 'approved');
  const rejected = list.filter(s => s.status === 'rejected');
  const pendingAmount = pending.reduce((sum, s) => sum + (s.amount || 0), 0);
  const approvedAmount = approved.reduce((sum, s) => sum + (s.amount || 0), 0);
  const totalCommission = list.reduce((sum, s) => sum + (s.commission_fee || 0), 0);
  
  const statusMap = { pending: '待审核', approved: '已批准', rejected: '已驳回' };
  const statusCls = { pending: 'badge-pending', approved: 'badge-approved', rejected: 'badge-rejected' };
  
  el.innerHTML = `
    <div class="stats-row">
      <div class="stat-card"><div class="stat-value">¥${pendingAmount.toFixed(2)}</div><div class="stat-label">待审核金额</div></div>
      <div class="stat-card"><div class="stat-value">¥${approvedAmount.toFixed(2)}</div><div class="stat-label">已发放金额</div></div>
      <div class="stat-card"><div class="stat-value">¥${totalCommission.toFixed(2)}</div><div class="stat-label">平台佣金收入</div></div>
      <div class="stat-card"><div class="stat-value">${list.length}</div><div class="stat-label">结算单总数</div></div>
    </div>
    <div class="card">
      <div class="card-header">
        <div class="card-title"><span class="icon">💰</span>结算单列表</div>
        <div class="filter-row" style="margin:0">
          <select id="settlementStatusFilter" onchange="filterSettlements()">
            <option value="">全部状态</option>
            <option value="pending">待审核</option>
            <option value="approved">已批准</option>
            <option value="rejected">已驳回</option>
          </select>
        </div>
      </div>
      <table><thead><tr><th>#</th><th>订单号</th><th>司机</th><th>运费</th><th>佣金</th><th>实发金额</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="settlementsTbody"></tbody></table>
    </div>`;
  renderSettlementsRows(list);
}

function renderSettlementsRows(list) {
  const tbody = document.getElementById('settlementsTbody');
  if (!list.length) { tbody.innerHTML = '<tr><td colspan="9" class="empty-state"><div class="icon">💸</div><p>暂无结算单</p></td></tr>'; return; }
  const statusMap = { pending: '待审核', approved: '已批准', rejected: '已驳回' };
  const statusCls = { pending: 'badge-pending', approved: 'badge-approved', rejected: 'badge-rejected' };
  tbody.innerHTML = list.map(s => `<tr>
    <td><b>#${s.id}</b></td>
    <td>订单#${s.order_id || '-'}</td>
    <td>司机${s.driver_id || '-'}</td>
    <td><b>¥${s.freight || 0}</b></td>
    <td class="td-secondary">¥${s.commission_fee || 0}</td>
    <td><b>¥${s.amount || 0}</b></td>
    <td><span class="badge ${statusCls[s.status] || 'badge-gray'}">${statusMap[s.status] || s.status}</span></td>
    <td class="td-secondary">${(s.create_time || '').slice(0, 16)}</td>
    <td>${s.status === 'pending' ? `<button class="btn-sm btn-success" onclick="approveSettlement(${s.id})">✓ 批准</button> <button class="btn-sm btn-danger" onclick="rejectSettlement(${s.id})">✗ 驳回</button>` : `<span class="td-secondary">${s.status === 'rejected' ? '原因: ' + (s.reject_reason || '-') : '已完成'}</span>`}</td>
  </tr>`).join('');
}

function filterSettlements() {
  const status = document.getElementById('settlementStatusFilter').value;
  renderSettlementsRows(window._settlements.filter(s => !status || s.status === status));
}

async function approveSettlement(id) {
  if (!confirm('确定批准该结算单？')) return;
  try {
    await api(`/admin/settlements/${id}/approve`, { method: 'POST' });
    alert('批准成功');
    switchTab('finance');
  } catch (e) { alert('批准失败: ' + e.message); }
}

async function rejectSettlement(id) {
  const reason = prompt('请输入驳回原因:');
  if (!reason) return;
  try {
    await api(`/admin/settlements/${id}/reject`, { method: 'POST', body: JSON.stringify({ reason }) });
    alert('驳回成功');
    switchTab('finance');
  } catch (e) { alert('驳回失败: ' + e.message); }
}
